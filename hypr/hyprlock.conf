# Variables
$outerColor = rgb(49, 170, 204)
$innerColor = rgba(35, 35, 36, 0.75)
$fontColor = rgb(216, 222, 233)
$checkColor = rgb(131, 168, 98)
$failColor = rgb(173, 86, 95)
$fontFamily = Iosevka Nerd Font Mono

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = DP-1
	path = /home/marushu/Wallpapers/Denia.png
	color = rgba(0, 0, 0, 1.0)
	blur_passes = 2
}

input-field { # Input
    monitor = DP-1
    size = 250, 50
    outline_thickness = 2
    
    dots_size = 0.1
    dots_spacing = 0.3
    
    outer_color = $outerColor
    inner_color = $innerColor
    check_color = $checkColor
    fail_color = $failColor

    font_color = $fontColor
    font_family = $fontFamily
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

label { # Clock
    monitor = DP-1
    text = $TIME

    color = $fontColor
    font_size = 75
    font_family = $fontFamily

    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor = DP-1
    text = cmd[update:5000] date +"%A, %B %d"

    color = $fontColor
    font_size = 17
    font_family = $fontFamily

    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor = DP-1
    text = Welcome Back, Marushu
    outline_thickness = 2

    color = $fontColor
    font_size = 20
    font_family = $fontFamily

    position = 0, 50
    halign = center
    valign = bottom
}
